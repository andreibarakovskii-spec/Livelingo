name: Build LiveLingo APK

on:
  push:
    branches: [ main, v2-business ]
  pull_request:
    branches: [ main, v2-business ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Show environment
        run: |
          java -version
          gradle --version
          echo "branch=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"

      - name: Compile Java sources
        run: gradle compileDebugJavaWithJavac --stacktrace --warning-mode all

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --warning-mode all

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiveLingo-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiveLingo-v2-business-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
